name: SKYLRK stock watch
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check SKYLRK
        timeout-minutes: 2
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python "skylrk watch.py"
      - name: Check JUNO RINSE
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          STORE: https://junorinse.com
          STORE_NAME: JUNO RINSE
          STATE_FILE: state-junorinse.json
        run: python "skylrk watch.py"
      - name: Save state
        if: always()
        run: |
          git add -A .
          if ! git diff --cached --quiet; then
            git config user.name "skylrk-bot"
            git config user.email "skylrk-bot@users.noreply.github.com"
            git commit -m "Update stock state"
            git push
          fi
