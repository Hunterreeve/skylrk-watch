name: SKYLRK stock watch
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check SKYLRK
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python skylrk_watch.py
      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "skylrk-bot"
            git config user.email "skylrk-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Update stock state"
            git push
          fi
